name: restpilot_app
description: RestPilot — Restaurant Management App for Staff & Admins
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^18.0.1

  # Dependency Injection
  get_it: ^9.2.1

  # Backend
  supabase_flutter: ^2.5.0

  # QR codes
  qr_flutter: ^4.1.0

  # Sharing
  share_plus: ^13.3.0
  url_launcher: ^6.3.0

  # Audio alerts (kitchen sound)
  audioplayers: ^6.1.0

  # UI utilities
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0

  # Persistence
  shared_preferences: ^2.3.0

  # Crypto (QR token generation)
  crypto: ^3.0.3

  # Google Fonts
  google_fonts: ^8.2.1

  # Environment config
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - .env
